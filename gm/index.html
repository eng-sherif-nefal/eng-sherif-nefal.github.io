<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المدير العام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ ورسمي، لوحة متابعة لسعادة المدير العام
   IDEA: ملف متابعة أوراق الشركة — تلات دُرج (عروض، عقود، عقود جارية)
   PICTURE: الكروت نفسها هي الصورة، بخط كبير وأرقام واضحة
   COLOUR and TYPE: كحلي نفال سائد، ذهبي للتمييز، أبيض؛ Cairo
   LAYOUT: شريط علوي، تبويبات كبيرة، ملخص، ثم كروت عمود أو عمودين */
:root{color-scheme:light dark;--bg:light-dark(#eef1f6,#0d1626);--card:light-dark(#fff,#16233a);--ink:light-dark(#0f1c33,#eef2f8);--mute:light-dark(#4b5a73,#a9b6cc);--navy:#13294b;--gold:#c9a227;--line:light-dark(#d6dce6,#2a3a57);--pink:light-dark(#fde8f1,#3a1428);--fuch:light-dark(#a3005f,#ff7ab8);--newq:light-dark(#dbeafe,#12325a);--newc:light-dark(#dcfce7,#123d27);--newr:light-dark(#a7e3b5,#1d5c37);--ok:light-dark(#0a7a3d,#4fd38a);--wait:light-dark(#9a6200,#ffc457)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Cairo,Tahoma,sans-serif;overflow-x:clip}
button,input{font:inherit}
.top{background:var(--navy);color:#fff;padding:18px max(4vw,16px) 20px;border-bottom:6px solid var(--gold)}
.top h1{margin:0;font-size:clamp(26px,4.5vw,38px);line-height:1.15;font-weight:800}
.pill{display:inline-block;margin-top:8px;background:var(--gold);color:#13294b;font-weight:800;border-radius:999px;padding:4px 18px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px;font-size:16px;color:#d7e0f0}
.out{margin-inline-start:auto;background:transparent;border:2px solid #fff;color:#fff;border-radius:12px;padding:8px 18px;min-height:48px;cursor:pointer;font-weight:600}
.wrap{max-width:1240px;margin:0 auto;padding:18px max(4vw,16px) 40px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tab{min-height:72px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:clamp(17px,2.4vw,22px);cursor:pointer;padding:8px}
.tab b{display:block;font-size:15px;font-weight:600;color:var(--mute)}
.tab[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--gold)}
.tab[aria-selected=true] b{color:#f4dc8a}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tile span{display:block;color:var(--mute);font-size:16px}
.tile strong{font-size:clamp(24px,3.6vw,32px);white-space:nowrap}
.search{width:100%;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;font-size:18px;margin-bottom:14px}
.search:focus,.tab:focus-visible,.out:focus-visible,.go:focus-visible,.pw:focus{outline:3px solid var(--gold);outline-offset:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--navy);border-radius:16px;overflow:hidden}
.card h3{margin:0;padding:12px 16px;background:var(--pink);color:var(--fuch);font-size:22px;line-height:1.3}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-top:1px solid var(--line)}
.row span{color:var(--mute)}.row strong{text-align:start;white-space:nowrap}
.row.wrapv strong{white-space:normal}
.st{display:inline-block;border-radius:999px;padding:2px 14px;font-weight:800;font-size:16px;border:2px solid currentColor}
.st.ok{color:var(--ok)}.st.wait{color:var(--wait)}
.bar{height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin:2px 16px 12px}
.bar i{display:block;height:100%;background:var(--gold)}
.empty{padding:30px;text-align:center;color:var(--mute);background:var(--card);border-radius:16px}
.note{margin-top:18px;font-size:15px;color:var(--mute);text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.item[open]{border-color:var(--navy)}.item.nq{background:var(--newq);border-color:#2563eb}.item.nc{background:var(--newc);border-color:#16a34a}.item.nr{background:var(--newr);border-color:#15803d}.item.nq .det,.item.nc .det,.item.nr .det{background:var(--card)}.today{display:inline-block;font-size:14px;font-weight:800;border-radius:8px;padding:0 8px;background:var(--navy);color:#fff;margin-inline-start:6px;vertical-align:middle}.legend{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:15px;color:var(--mute)}.legend i{flex:none;width:22px;height:22px;border-radius:6px;display:inline-block;border:2px solid}
.item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;min-height:64px;align-items:center}
.item>summary::-webkit-details-marker{display:none}
.item>summary:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.pn{color:var(--fuch);font-weight:800;font-size:20px;line-height:1.3}
.sub{grid-column:1;color:var(--mute);font-size:15px}
.sts{grid-column:1/-1}.st{white-space:normal}.rt{grid-row:1/3;grid-column:2;text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.rt strong{white-space:nowrap;font-size:18px}
.chev{font-size:22px;color:var(--mute);transition:transform .2s}
.item[open] .chev{transform:rotate(180deg)}
.det{border-top:2px solid var(--gold);padding:6px 0 14px}
.det h4{margin:14px 16px 6px;font-size:18px;color:var(--ink);border-inline-start:5px solid var(--gold);padding-inline-start:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kv .row strong{white-space:normal}.row span{flex:0 0 auto;max-width:42%}.row strong{flex:1 1 auto;text-align:end}
table{width:calc(100% - 32px);margin:4px 16px;border-collapse:collapse;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:start}
th{color:var(--mute);font-weight:600}
td.n,th.n{text-align:end;white-space:nowrap}
tfoot td{font-weight:800}
.tl{display:flex;flex-wrap:wrap;gap:8px;margin:4px 16px}
.tl div{flex:1 1 140px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:15px}
.tl div.d{border-color:var(--ok)}.tl b{display:block}
.txt{margin:4px 16px;}bdi{white-space:nowrap}
.files{margin:4px 16px;padding-inline-start:20px}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute)}.stack td:empty{display:none}.pn{font-size:18px}}
.fg{margin:6px 16px 10px}.fg b{display:block;color:var(--mute);font-size:15px;margin-bottom:4px}.fl{display:flex;align-items:center;min-height:48px;padding:8px 12px;margin:6px 0;border:2px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;background:var(--bg)}.fl:hover,.fl:focus-visible{border-color:var(--gold);outline:none}.files.warn li{color:var(--wait);font-weight:600}.src{font-size:15px;color:var(--mute)}.files li{margin:4px 0}
.ggs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.gg{text-align:center;display:flex;flex-direction:column;align-items:center}.gg svg{width:100%;max-width:92px;height:auto}.gg b{font-size:15px;line-height:1.2}.gg small{font-size:13px;color:var(--mute);white-space:nowrap}.per{grid-column:1/-1;font-size:16px;font-weight:600;margin-top:4px}.item.late{background:light-dark(#fee2e2,#4a1515);border-color:#dc2626}.item.late .det{background:var(--card)}
.cd{grid-column:1/-1;margin-top:10px;border-radius:14px;padding:8px 10px 10px;text-align:center;border:3px solid}.cd.green{border-color:#16a34a;background:light-dark(#ecfdf3,#0f2e1c)}.cd.red{border-color:#dc2626;background:light-dark(#fef2f2,#3a1111)}.cdt{font-size:15px;font-weight:700;color:var(--mute)}.cdd{display:flex;justify-content:center;align-items:flex-start;gap:4px;direction:ltr;font-variant-numeric:tabular-nums}.cd .u{display:flex;flex-direction:column;align-items:center;min-width:0}.cd .u b{font-size:clamp(28px,9vw,44px);font-weight:800;line-height:1.1}.cd .u i{font-style:normal;font-size:13px;color:var(--mute)}.cd .sep{font-size:clamp(26px,8vw,40px);font-weight:800;line-height:1.05}.cd.green .u b,.cd.green .sep{color:#15803d}.cd.red .u b,.cd.red .sep,.cd .cdx{color:#dc2626}.cdx{font-size:clamp(26px,8vw,40px);font-weight:800}.cd small{display:block;color:#dc2626;font-weight:700}
.cno{font-size:19px;font-weight:800;color:var(--ink)}.rt strong{font-size:20px;font-weight:800}.gg small{font-weight:800;color:var(--ink);font-size:14px}.fl{justify-content:space-between;gap:8px}.fl .dl{flex:none;font-size:14px;color:#fff;background:var(--navy);border-radius:8px;padding:4px 10px}
button.fl{width:100%;font:inherit;font-weight:600;text-align:start;cursor:pointer}.fl.ready{gap:8px}.acts2{display:flex;gap:6px;flex:none}.acts2 a{text-decoration:none}
#lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--navy)}
.box{width:min(460px,100%);background:var(--card);border-radius:20px;padding:28px;border-top:8px solid var(--gold);text-align:center}
.box h2{margin:0 0 6px;font-size:28px}
.box p{margin:0 0 16px;color:var(--mute)}
.pw{width:100%;min-height:60px;font-size:22px;text-align:center;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);letter-spacing:2px}
.go{width:100%;min-height:60px;margin-top:12px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-size:22px;font-weight:800;cursor:pointer}
.err{color:#d11;min-height:28px;margin-top:8px;font-weight:600}
.demo{margin-top:14px;font-size:15px;color:var(--mute)}
#app[hidden],#lock[hidden]{display:none}
@media(max-width:600px){body{font-size:17px}.tile{padding:8px 10px}.tile span{font-size:14px;line-height:1.3}.tile strong{font-size:19px;white-space:normal}.tab{min-height:64px}.card h3{font-size:20px}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<section id="lock">
  <form class="box" id="lf">
    <h2>نفال للتكييف</h2>
    <p>لوحة متابعة سعادة المدير العام</p>
    <label for="pw" style="display:block;font-weight:600;margin-bottom:6px">الرقم السري</label>
    <input id="pw" class="pw" type="password" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
    <label style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;font-size:17px"><input type="checkbox" id="show" style="width:24px;height:24px"> إظهار الرقم</label>
    <button class="go" type="submit">دخول</button>
    <div class="err" id="err" role="alert"></div>
    
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <h1>لوحة متابعة نفال للتكييف</h1>
    <div class="pill">نسخة سعادة المدير العام حفظه الله</div>
    <div class="meta"><span id="upd"></span><span>عرض فقط — بدون تعديل</span><button class="out" id="out" type="button">🚪 خروج</button></div>
  </header>
  <main class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="quotes" id="t-quotes">عروض وطلبات أسعار<b id="n-quotes"></b></button>
      <button class="tab" role="tab" data-t="contracts" id="t-contracts">العقود<b id="n-contracts"></b></button>
      <button class="tab" role="tab" data-t="running" id="t-running">العقود الجارية<b id="n-running"></b></button>
    </div>
    <div class="sum" id="sum"></div>
    <input class="search" id="q" type="search" placeholder="🔍 ابحث باسم المشروع أو العميل أو الرقم">
    <div class="legend" id="legend"></div>
    <div class="list" id="cards"></div>
    <p class="note">اضغط على أي مشروع تظهر كل تفاصيله. العقود هنا كلها معتمدة من نفال؛ الحالة بتوضح موقف العميل، وأول ما الدفعة المقدمة توصل العقد بيتعمّد وينتقل للعقود الجارية.</p>
  </main>
</div>

async function decrypt(pw){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:200000,hash:'SHA-256'},key,{name:'AES-GCM',length:256},false,['decrypt']);
  KEY=k;
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},k,b64(ENC.ct))));
}

  if(x.pending) return `<details class="item${nw?' nq':''}">${head(x,sub,x.ex?sar(x.ex):'لم يُسعَّر',x.status,nw)}<div class="det">
   ${sec('بيانات الطلب',kv([['الرقم',B(esc(x.no))],['العميل',esc(x.client)],['مسؤول المبيعات',esc(x.sales)],['تاريخ الوصول',B(esc(x.d))],['قيمة العرض المقترحة',x.ex?sar(x.ex):''],['نسبة الربح على التكلفة المباشرة',x.profitPct?B(x.profitPct+'%'):''],['السعر المستهدف (تارجت)',esc(x.target||'')]]))}
   ${sec('ليه مستني قرار',ul(x.issues,'warn'))}
   ${sec('البنود المسعّرة',ul(x.priced))}
   ${sec('ما تم عمله',ul(x.done))}
   ${sec('بنود غير مسعّرة',ul(x.unpriced))}
   ${sec('خارج العرض',ul(x.outside))}
   ${sec('الشروط',ul(x.terms))}
   ${x.drawings?sec('المخططات',`<p class="txt">${esc(x.drawings)}</p>`):''}
   <h4>الملفات</h4>${files(x.files)}</div></details>`;
  const f=x.fin||{},dc=f.dc,pf=f.pf;
  return `<details class="item${nw?' nq':''}">${head(x,sub,sar(x.ex),x.status,nw)}<div class="det">
  ${sec('بيانات المشروع',kv([['رقم العرض',B(esc(x.no))],['التاريخ',B(esc(x.date))],['العميل',esc(x.client)],['الجهة',x.co&&x.co!==x.client?esc(x.co):''],['العناية',esc(x.attn)],['مسؤول المبيعات',esc(x.sales)],['نوع العرض',esc(x.type)]]))}
  ${x.full&&x.full!==x.project?sec('وصف المشروع',`<p class="txt">${esc(x.full)}</p>`):''}
  ${x.scope.length?sec('نطاق العرض',tbl([['البند'],['الحالة'],['التفاصيل']],x.scope.map(r=>[esc(r[0]),esc(SC[r[1]]||r[1]),esc(r[2])]))):''}
  ${x.units.length?sec('الوحدات',tbl([['النوع'],['الماركة'],['القدرة (طن)'],['العدد',1]],x.units.map(u=>[esc(u[0]),esc(u[1]),esc(u[2]),esc(u[3])]),['الإجمالي','','',x.units.reduce((a,u)=>a+(+u[3]||0),0)])):''}
  ${x.fans&&x.fans.length?sec('المراوح',tbl([['النوع'],['الماركة'],['CFM'],['العدد',1]],x.fans.map(u=>u.map(esc)))):''}
  ${x.ex?sec('التحليل المالي',kv([['قيمة العرض (قبل الضريبة)',sar(x.ex)],['ضريبة القيمة المضافة 15%',sar(x.inc&&x.ex?x.inc-x.ex:x.ex*VAT)],['الإجمالي شامل الضريبة',sar(x.inc||x.ex*(1+VAT))],['التكلفة المباشرة',sar(dc)],['مصاريف غير مباشرة',f.ind?sar(f.ind):''],['مصاريف تمهيدية',f.pre?sar(f.pre):''],['الربح',sar(pf)],['نسبة الربح على التكلفة المباشرة',dc&&pf!=null?B((pf/dc*100).toFixed(2)+'%'):'']])+(f.src?`<p class="txt src">${esc(f.src)}</p>`:'')):''}
  ${x.spec.length?sec('ملخص العرض',kv(x.spec.map(r=>[esc(r[0]),esc(r[1])]))):''}
  ${x.refs.length?sec('الريفيجنات والمراجع',tbl([['العرض'],['القيمة',1],['ملاحظة']],x.refs.map(r=>[B(esc(r.q))+(r.cur?' ✓ الحالي':''),sar(r.val),esc(r.note||r.dw||'')]))):''}
  <h4>الملفات</h4>${files(x.files)}</div></details>`},
 contracts:x=>{const nw=isNew(x.added);return `<details class="item${nw?' nc':''}">${head(x,'<span class="cno">عقد رقم '+B(esc(x.no))+'</span>',sar(x.value),x.status,nw)}<div class="det">
  ${sec('بيانات العقد',kv([['رقم العقد',B(esc(x.no))],['من عرض السعر',B(esc(x.quoteRef))],['العميل',esc(x.client)],['مسؤول المبيعات',esc(x.sales)],['مصدر العقد',esc(x.source)],['تاريخ التصدير',B(esc(x.exported))]]))}
  ${sec('القيمة والمدة',kv([['قيمة العقد (قبل الضريبة)',sar(x.value)],['الضريبة 15%',sar(x.value*VAT)],['الإجمالي شامل الضريبة',sar(x.value*(1+VAT))],['نسبة الربح على التكلفة المباشرة',x.profitPct?B(x.profitPct+'%'):''],['مدة العقد',esc(x.duration)],['الدفعة المقدمة',esc(x.advance)]]))}
  ${sec('تنبيهات الربح',ul(x.profitAlerts,'warn'))}
  ${sec('الغرامات والشروط الجزائية',ul(x.penalties,'warn'))}
  ${sec('ملاحظات المراجعة',ul(x.issues))}
  ${sec('اختلافات عن عرض السعر',ul(x.mismatches))}
  ${sec('ملاحظات قانونية',ul(x.legal))}
  ${sec('ما تم في العقد',ul(x.done))}
  ${x.note?sec('ملاحظة',`<p class="txt">${esc(x.note)}</p>`):''}
  <h4>الملفات</h4>${files(x.files)}</div></details>`},
 running:x=>{const nw=isNew(x.added),got=x.pays.reduce((a,p)=>a+(+p.got||0),0),days=x.end?Math.round((new Date(x.end)-new Date(TODAY))/864e5):null,late=days!=null&&days<=30;
  const status=x.advPaid?'الدفعة المقدمة مدفوعة':'الدفعة المقدمة لم تسدد';
  const tot=x.start&&x.end?Math.round((new Date(x.end)-new Date(x.start))/864e5):null,gp=x.value?got/x.value*100:0,dleft=days==null?null:Math.max(0,days);
  const gs=`<div class="ggs">${gauge(gp,'#16a34a',Math.round(gp)+'%','المحصّل',num(Math.round(got))+' ريال')}${gauge(100-gp,'#dc2626',Math.round(100-gp)+'%','المتبقي',num(Math.round(x.value-got))+' ريال')}${gauge(x.done,'#c9a227',x.done+'%','نسبة التنفيذ','')}</div>${x.end?`<div class="cd ${late?'red':'green'}" data-end="${esc(x.end)}"><div class="cdt">المدة المتبقية</div><div class="cdd"></div></div>`:''}<div class="per">مدة التنفيذ: ${esc(x.period||'—')}</div>${tot?`<div class="per">${tot} يوم: من ${B(fd(x.start))} إلى ${B(fd(x.end))}`:''}</div>`;
  return `<details class="item${nw?' nr':''}${late?' late':''}">${head(x,'<span class="cno">عقد رقم '+B(esc(x.no))+'</span>',sar(x.value),status,nw).replace('</summary>',gs+'</summary>')}<div class="det">
  <div class="bar" style="margin-top:12px" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,x.done))}%"></i></div>
  ${sec('بيانات العقد',kv([['رقم العقد',B(esc(x.no))],['العميل',esc(x.client)],['جوال العميل',x.clientMob?B(esc(x.clientMob)):''],['مسؤول المبيعات',esc(x.rep)],['جوال مسؤول المبيعات',x.repMob?B(esc(x.repMob)):''],['من عرض السعر',B(esc(x.quote))],['الماركة',esc(x.brand)],['التعميد لـ',esc(x.dest)],['تاريخ التعميد',B(esc(x.added))],['العقد موقّع من العميل',x.signed?'نعم':'لسه']]))}
  ${sec('ملخص المشروع',`<p class="txt">${esc(x.summary)}</p>`)}
  ${x.units.length?sec('الوحدات',tbl([['النوع'],['الماركة'],['القدرة'],['العدد',1]],x.units.map(u=>u.map(esc)),['الإجمالي','','',x.units.reduce((a,u)=>a+(+u[3]||0),0)])+(x.unitsNote?`<p class="txt">${esc(x.unitsNote)}</p>`:'')):(x.unitsNote?sec('الوحدات',`<p class="txt">${esc(x.unitsNote)}</p>`):'')}
  ${sec('القيمة والتحصيل',kv([['قيمة العقد',sar(x.value)],['المحصّل حتى الآن',sar(got)],['المتبقي من قيمة العقد',sar(x.value-got)],['نسبة التحصيل',x.value?B((got/x.value*100).toFixed(1)+'%'):'']]))}
  ${sec('المدة',kv([['تاريخ العقد',B(esc(x.contractDate))],['البداية',B(esc(x.start))],['النهاية',B(esc(x.end))+(late?' <span class="st wait">قرّب يخلص</span>':'')],['الأيام المتبقية',days!=null?B(days+' يوم'):''],['حساب النهاية',esc(x.endBy)],['مدة العقد',esc(x.period)],['غرامة التأخير',esc(x.penalty)]]))}
  ${sec('جدول الدفعات',tbl([['الدفعة'],['النسبة',1],['المبلغ',1],['المحصّل',1],['متى']],x.pays.map(p=>[esc(p.t)+(p.d?'<br><small>'+B(esc(p.d))+' — '+esc(p.doc||'')+'</small>':''),p.p?B(p.p+'%'):'—',p.p?sar(x.value*p.p/100):'—',sar(p.got),esc(p.on)]),['الإجمالي','','',sar(got),'']))}
  ${x.works.length?sec('مراحل التنفيذ',tbl([['المرحلة'],['الوزن',1],['الإنجاز',1]],x.works.map(w=>[esc(w.t),B(w.w+'%'),B(w.p+'%')]))):''}
  ${x.hand.length?sec('التسليم',tbl([['المستند'],['الحالة']],x.hand.map(h=>[esc(h.t),esc(h.st)]))):''}
  ${sec('المستخلصات',x.claims.length?ul(x.claims.map(c=>JSON.stringify(c))):'<p class="txt">مفيش مستخلصات مسجّلة لسه</p>')}
  ${sec('الأعمال الإضافية',x.extras.length?ul(x.extras.map(c=>JSON.stringify(c))):'<p class="txt">مفيش أعمال إضافية مسجّلة</p>')}
  <h4>الملفات</h4>${files(x.files)}</div></details>`}
};
const fd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?`${m[3]}/${m[2]}/${m[1]}`:esc(s)};
const p2=n=>String(n).padStart(2,'0');
function tick(){document.querySelectorAll('.cd').forEach(el=>{const end=new Date(el.dataset.end+'T23:59:59+03:00').getTime(),ms=end-Date.now(),box=el.querySelector('.cdd');
  if(ms<=0){const d=Math.floor(-ms/864e5);el.className='cd red';box.innerHTML=`<span class="cdx">انتهت المدة</span>${d?`<small>من ${d} يوم</small>`:''}`;return}
  const s=Math.floor(ms/1e3),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
  box.innerHTML=[[d,'يوم'],[p2(h),'ساعة'],[p2(m),'دقيقة'],[p2(c),'ثانية']].map(([v,l])=>`<span class="u"><b>${v}</b><i>${l}</i></span>`).join('<span class="sep">:</span>')})}
setInterval(tick,1000);
function sums(){
  const L=D[T]||[];let t;
  if(T==='quotes'){const I=L.filter(x=>x.status==='صادر');t=[['عروض صادرة',I.length],['إجمالي العروض الصادرة',big(I.reduce((a,x)=>a+(+x.ex||0),0))],['مستني قرار',L.filter(x=>x.pending).length]]}
  if(T==='contracts')t=[['بانتظار توقيع العميل',L.filter(x=>x.status==='بانتظار توقيع العميل').length],['معتمد – بانتظار الدفعة المقدمة',L.filter(x=>x.status.startsWith('معتمد')).length],['إجمالي القيمة',big(L.reduce((a,x)=>a+(+x.value||0),0))]];
  if(T==='running'){const v=L.reduce((a,x)=>a+(+x.value||0),0),g=L.reduce((a,x)=>a+x.pays.reduce((b,p)=>b+(+p.got||0),0),0);t=[['عقود جارية',L.length],['إجمالي القيمة',big(v)],['المحصّل',big(g)]]}
  $('sum').innerHTML=t.map(([l,v])=>`<div class="tile"><span>${l}</span><strong>${v}</strong></div>`).join('');
}
const norm=s=>String(s||'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
function draw(){
  for(const k of ['quotes','contracts','running']){$('t-'+k).setAttribute('aria-selected',k===T);$('n-'+k).textContent=(D[k]||[]).length+' مشروع'}
  sums();
  const LG={quotes:['var(--newq)','#2563eb','لون أزرق فاتح = عرض أو طلب طلع النهاردة'],contracts:['var(--newc)','#16a34a','لون أخضر فاتح = عقد نزل النهاردة'],running:['var(--newr)','#15803d','لون أخضر غامق = عقد اتعمّد النهاردة']}[T];
  $('legend').innerHTML=`<i style="background:${LG[0]};border-color:${LG[1]}"></i>${LG[2]} — من بكرة يرجع عادي`;
  const q=norm($('q').value.trim()).split(/\s+/).filter(Boolean);
  const dk=x=>x.added||x.d||'';
  const L=(D[T]||[]).filter(x=>{const h=norm([x.project,x.client,x.no,x.sales,x.rep,x.full].join(' '));return q.every(w=>h.includes(w))}).sort((a,b)=>dk(b).localeCompare(dk(a)));
  $('cards').innerHTML=L.length?L.map(R[T]).join(''):'<div class="empty">مفيش مشاريع هنا</div>';
  tick();document.querySelectorAll('#cards table').forEach(tb=>{const h=[...tb.tHead.rows[0].cells].map(c=>c.textContent);tb.querySelectorAll('tbody tr,tfoot tr').forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=h[i]||''))});
  $('upd').textContent='آخر تحديث للبيانات: '+new Date(D.updated).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Riyadh'});
}
$('lf').addEventListener('submit',async e=>{
  e.preventDefault();$('err').textContent='';
  try{D=await decrypt(normPw($('pw').value));$('pw').value='';$('lock').hidden=true;$('app').hidden=false;try{T=localStorage.getItem('gm-tab')||T}catch(_){}draw();
    clearTimeout(timer);timer=setTimeout(()=>$('out').click(),30*60*1000);}
  catch(_){$('err').textContent='الرقم السري غير صحيح'}
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{T=b.dataset.t;try{localStorage.setItem('gm-tab',T)}catch(_){}draw()}));
$('q').addEventListener('input',draw);
$('show').addEventListener('change',e=>{$('pw').type=e.target.checked?'text':'password'});
$('out').addEventListener('click',()=>{D=null;$('cards').innerHTML='';$('app').hidden=true;$('lock').hidden=false;$('pw').focus()});
}
</script>

</body>
</html>
